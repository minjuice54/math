<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>직각 탐정</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 위쪽 사건 진행 띠 → 한 화면에 사건 하나. 왼쪽 실험판(모눈) / 오른쪽 수사 노트 */
:root{
  --bg:#FFF7E6; --paper:#FFFFFF; --ink:#22201C; --muted:#6E675B; --grid:#E7DCC4; --gridDot:#BBAE90;
  --lemon:#FFE14D; --coral:#FF8A7A; --sky:#7CC8FF; --mint:#6FD9A8; --soft:#F4EAD2;
  --okBg:#D9F6E7; --okInk:#0E6A43; --noBg:#FFE2DD; --noInk:#B3271A;
  --shadow:#22201C;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1A16; --paper:#28251F; --ink:#F3ECDC; --muted:#B9AF9A; --grid:#3A362D; --gridDot:#6B6352; --soft:#34302797;
  --lemon:#E8CB3C; --coral:#EA7A6B; --sky:#5DB2E8; --mint:#4DC08C;
  --okBg:#1D3A2C; --okInk:#8EE5BA; --noBg:#45231E; --noInk:#FF9D8E; --shadow:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1A16; --paper:#28251F; --ink:#F3ECDC; --muted:#B9AF9A; --grid:#3A362D; --gridDot:#6B6352; --soft:#34302797;
  --lemon:#E8CB3C; --coral:#EA7A6B; --sky:#5DB2E8; --mint:#4DC08C;
  --okBg:#1D3A2C; --okInk:#8EE5BA; --noBg:#45231E; --noInk:#FF9D8E; --shadow:#000; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-block:14px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:32px;margin:0;letter-spacing:-.5px}
h1 .badge{display:inline-block;background:var(--ink);color:var(--paper);border-radius:8px;padding:0 10px;margin-right:8px;font-size:22px;vertical-align:4px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.step{border:2.5px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px;background:var(--paper);color:var(--muted);cursor:pointer;font-family:inherit}
.step.on{background:var(--lemon);color:#22201C}
.step.done{background:var(--mint);color:#22201C}
.step:disabled{cursor:not-allowed;opacity:.55}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--shadow);padding:18px 20px;min-width:0}
.case-h{font-family:var(--display);font-size:26px;font-weight:400;margin:0 0 6px}
.lead{font-size:17px;margin:0 0 10px}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
button{font:inherit;color:inherit}
.btn{border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 var(--shadow);padding:7px 16px;font-weight:800;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.go{background:var(--mint);color:#22201C}
.btn.hot{background:var(--coral);color:#22201C}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow)}
.btn:focus-visible,.step:focus-visible,.opt:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
/* 실험판 */
.board{width:100%;max-width:640px;aspect-ratio:640/470;touch-action:none;user-select:none;display:block;background:var(--paper);border-radius:12px}
.board *{vector-effect:non-scaling-stroke}
.board .gl{stroke:var(--grid);stroke-width:1.4}
.board .zone{fill:none;stroke:var(--gridDot);stroke-width:2;stroke-dasharray:6 5}
.board .gd{fill:var(--gridDot)}
.board .tri{fill:var(--sky);fill-opacity:.28;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
.board .sqr{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 4;fill-opacity:.32}
.board .sqn{font-family:var(--display);fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:5px}
.board .h{fill:var(--coral);stroke:var(--ink);stroke-width:3;cursor:grab}
.board .h.drag{cursor:grabbing;fill:var(--lemon)}
.board .vl{font-family:"Times New Roman",serif;font-style:italic;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.board .rm{fill:none;stroke:var(--noInk);stroke-width:3}
.read{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.read div{border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px;text-align:center;background:var(--bg)}
.read b{display:block;font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.read span{font-size:13px;color:var(--muted)}
.angle{border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
.angle.right{background:var(--okBg);color:var(--okInk)}
.angle.big{background:var(--noBg);color:var(--noInk)}
.angle.small{background:var(--soft)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
th,td{border-bottom:1.5px solid var(--grid);padding:6px 4px;text-align:center}
th{font-size:13px;color:var(--muted);font-weight:700}
td.sum{font-weight:900}
.hidden-col{color:transparent;text-shadow:none}
.sumIn{width:84px;font:inherit;font-weight:900;font-size:18px;text-align:center;border:2.5px solid var(--ink);border-radius:8px;padding:2px 4px;background:var(--lemon);color:#22201C}
.sumIn.wrong{background:var(--noBg);color:var(--noInk);animation:shake .3s}
td.sum.ok{color:var(--okInk)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mission{border:2.5px dashed var(--ink);border-radius:14px;padding:10px 14px;background:var(--bg);margin-bottom:10px}
.mission b{font-family:var(--display);font-weight:400;font-size:19px}
.q{margin-top:12px;border:3px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--lemon);color:#22201C}
.q p{margin:0 0 8px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2.5px solid #22201C;border-radius:10px;background:#fff;color:#22201C;padding:7px 12px;text-align:left;font-weight:700;cursor:pointer;font-family:inherit;font-size:16px}
.opt.ok{background:#D9F6E7}.opt.no{background:#FFE2DD}
.fb{margin-top:8px;font-weight:700}
.math{font-family:"Times New Roman",serif;font-style:italic}
.rule{border:3px solid var(--ink);border-radius:14px;padding:12px 16px;background:var(--mint);color:#22201C;font-weight:800;font-size:18px;text-align:center}
.rule .big{font-family:"Times New Roman",serif;font-size:30px;display:block;margin-top:4px}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.note{color:var(--muted);font-size:14px}
/* 예상 퀴즈 */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.qc{border:2.5px solid var(--ink);border-radius:14px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.qc .tri3{font-family:var(--display);font-size:24px}
.qc .row{display:flex;gap:8px}
.qc .row .opt{flex:1;text-align:center}
.qc .why{font-size:14.5px;font-weight:600;min-height:1.5em}
/* 사건 파일 */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.file{border:3px solid var(--ink);border-radius:16px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.file .ttl{font-family:var(--display);font-size:20px;padding:8px 12px;border-bottom:2.5px solid var(--ink);background:var(--paper)}
.file svg{display:block;width:100%;height:auto;background:var(--paper)}
.file .body{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.scene-line{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}
.scene-lab{font-family:var(--body);font-weight:900;font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px}
.scene-q{font-family:var(--display);font-size:30px;fill:var(--noInk)}
.hint{font-size:14px;color:var(--muted)}
.final{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.stamp{align-self:center;font-family:var(--display);font-size:40px;border:5px solid var(--noInk);color:var(--noInk);border-radius:16px;padding:4px 24px;transform:rotate(-6deg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><span class="badge">7.5</span>직각 탐정</h1>
    <nav class="steps" id="steps" aria-label="사건 진행"></nav>
  </header>
  <main id="view"></main>
</div>

<script>
/* ---------------- 진행 상태 ---------------- */
const STEPS=[['s0','사건 0'],['m1','미션 1'],['m2','미션 2'],['m3','미션 3'],['m4','미션 4'],['end','사건 해결']];
const LS='right-detective-v1';
let st={at:'s0',done:{},rec1:[],rec2:[],q1:null,q2a:null,q2b:null,m3:{},m4:{}};
try{const s=JSON.parse(localStorage.getItem(LS)||'null'); if(s&&s.at) st=Object.assign(st,s);}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s);
function go(id){st.at=id;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function unlocked(id){const i=STEPS.findIndex(s=>s[0]===id);return i===0||STEPS.slice(0,i).every(s=>st.done[s[0]]);}
function renderSteps(){
  $('#steps').innerHTML=STEPS.map(([id,l])=>`<button class="step ${st.at===id?'on':''} ${st.done[id]?'done':''}" data-go="${id}" ${unlocked(id)?'':'disabled'}>${st.done[id]?'✔ ':''}${l}</button>`).join('');
}

/* ---------------- 모눈 실험판 ---------------- */
const CELL=40, COLS=15, ROWS=10, VW=640, VH=470;   // 꼭짓점은 격자점 (0..15, 0..10) 안에서 움직여요
let P=[{x:3,y:2},{x:9,y:2},{x:5,y:6}];
const px=p=>({x:p.x*CELL,y:-p.y*CELL});
const d2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
function info(){
  const [A,B,C]=P; const cross=(B.x-A.x)*(C.y-A.y)-(B.y-A.y)*(C.x-A.x);
  if(cross===0) return {bad:true};
  const s=[{n:'BC',v:d2(B,C),opp:0},{n:'CA',v:d2(C,A),opp:1},{n:'AB',v:d2(A,B),opp:2}];
  const sorted=s.slice().sort((p,q)=>p.v-q.v);
  const big=sorted[2], sum=sorted[0].v+sorted[1].v;
  const V=P[big.opp], O1=P[(big.opp+1)%3], O2=P[(big.opp+2)%3];
  const dot=(O1.x-V.x)*(O2.x-V.x)+(O1.y-V.y)*(O2.y-V.y);
  const ang=Math.acos(dot/Math.sqrt(d2(V,O1)*d2(V,O2)))*180/Math.PI;
  return {a:sorted[0].v,b:sorted[1].v,c:big.v,sum,ang,kind:dot===0?'right':dot<0?'big':'small',vi:big.opp};
}
function sqPts(a,b){ // 변 ab 바깥쪽 정사각형
  const [A,B,C]=P; const g={x:(A.x+B.x+C.x)/3,y:(A.y+B.y+C.y)/3};
  const d={x:b.x-a.x,y:b.y-a.y}; let n={x:-d.y,y:d.x};
  if(n.x*(g.x-a.x)+n.y*(g.y-a.y)>0) n={x:d.y,y:-d.x};
  return [a,b,{x:b.x+n.x,y:b.y+n.y},{x:a.x+n.x,y:a.y+n.y}];
}
/* 화면 맞춤: 삼각형과 세 정사각형이 모두 보이도록 */
let view=null;
function fitView(){
  let pts=[...P,{x:0,y:0},{x:COLS,y:ROWS}];
  if(showSq&&!info().bad) [[1,2],[2,0],[0,1]].forEach(([i,j])=>pts=pts.concat(sqPts(P[i],P[j])));
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  let x0=Math.min(...xs)-.8, x1=Math.max(...xs)+.8, y0=Math.min(...ys)-.8, y1=Math.max(...ys)+.8;
  let w=(x1-x0)*CELL, h=(y1-y0)*CELL; const r=VW/VH;
  if(w/h<r){const nw=h*r;x0-=(nw-w)/2/CELL;w=nw;} else {const nh=w/r;y0-=(nh-h)/2/CELL;h=nh;}
  return {x:x0*CELL,y:-(y0*CELL+h),w,h};
}
let tween=null;
function setView(target,animate){
  if(!animate||!view){view=target;return;}
  const from={...view},t0=performance.now();cancelAnimationFrame(tween);
  const step=now=>{const k=Math.min(1,(now-t0)/260),e=1-(1-k)**3;
    view={x:from.x+(target.x-from.x)*e,y:from.y+(target.y-from.y)*e,w:from.w+(target.w-from.w)*e,h:from.h+(target.h-from.h)*e};
    paint(); if(k<1) tween=requestAnimationFrame(step);};
  tween=requestAnimationFrame(step);
}
function boardSVG(){
  return `<svg class="board" id="board" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="모눈 위 삼각형 실험판">
    <g id="grid"></g><g id="sqs"></g><g id="trig"></g></svg>`;
}
let showSq=true;
function drawBoard(animate){ if(drag===null) setView(fitView(),animate); paint(); }
function paint(){
  const I=info(), sv=$('#board'); if(!sv||!view) return;
  sv.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
  const k=view.w/VW;
  /* 모눈 */
  let g='';
  const gx0=Math.floor(view.x/CELL)-1, gx1=Math.ceil((view.x+view.w)/CELL)+1, gy0=Math.floor(-(view.y+view.h)/CELL)-1, gy1=Math.ceil(-view.y/CELL)+1;
  for(let i=gx0;i<=gx1;i++) g+=`<line class="gl" x1="${i*CELL}" y1="${-gy0*CELL}" x2="${i*CELL}" y2="${-gy1*CELL}"/>`;
  for(let j=gy0;j<=gy1;j++) g+=`<line class="gl" x1="${gx0*CELL}" y1="${-j*CELL}" x2="${gx1*CELL}" y2="${-j*CELL}"/>`;
  g+=`<rect class="zone" x="0" y="${-ROWS*CELL}" width="${COLS*CELL}" height="${ROWS*CELL}"/>`;
  $('#grid').innerHTML=g;
  /* 정사각형 */
  const q=P.map(px), names=['A','B','C'];
  const cols=['var(--coral)','var(--lemon)','var(--mint)'];
  let sq='';
  if(showSq&&!I.bad){
    [[1,2],[2,0],[0,1]].forEach(([i,j],m)=>{
      const pts=sqPts(P[i],P[j]).map(px); const v=d2(P[i],P[j]);
      const cx=pts.reduce((s,p)=>s+p.x,0)/4, cy=pts.reduce((s,p)=>s+p.y,0)/4;
      sq+=`<polygon class="sqr" points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="${m===I.vi?'var(--sky)':cols[m]}"/><text class="sqn" style="font-size:${22*k}px" x="${cx}" y="${cy}">${v}</text>`;
    });
  }
  $('#sqs').innerHTML=sq;
  /* 삼각형 */
  let t=`<polygon class="tri" points="${q.map(p=>p.x+','+p.y).join(' ')}"/>`;
  if(!I.bad&&I.kind==='right'){
    const V=P[I.vi],O1=P[(I.vi+1)%3],O2=P[(I.vi+2)%3];
    const u=(o)=>{const L=Math.sqrt(d2(V,o));return {x:(o.x-V.x)/L*.38*Math.max(1,k),y:(o.y-V.y)/L*.38*Math.max(1,k)}};
    const a=u(O1),b=u(O2), p1=px({x:V.x+a.x,y:V.y+a.y}),p2=px({x:V.x+a.x+b.x,y:V.y+a.y+b.y}),p3=px({x:V.x+b.x,y:V.y+b.y});
    t+=`<polyline class="rm" points="${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}"/>`;
  }
  const gc={x:q.reduce((s,p)=>s+p.x,0)/3,y:q.reduce((s,p)=>s+p.y,0)/3};
  q.forEach((p,i)=>{const dx=p.x-gc.x,dy=p.y-gc.y,L=Math.hypot(dx,dy)||1;
    t+=`<text class="vl" style="font-size:${22*k}px" x="${p.x+dx/L*24*k}" y="${p.y+dy/L*24*k}">${names[i]}</text>`;});
  q.forEach((p,i)=>t+=`<circle class="h${drag===i?' drag':''}" data-i="${i}" cx="${p.x}" cy="${p.y}" r="${13*k}" tabindex="0" aria-label="꼭짓점 ${names[i]} 옮기기 (방향키)"/>`);
  $('#trig').innerHTML=t;
  const r=$('#readout'); if(r) r.innerHTML=readHTML(I);
  const rb=$('#recBtn'); if(rb) rb.disabled=!canRecord(I);
}
function readHTML(I){
  if(I.bad) return `<div class="angle small">세 점이 한 직선 위에 있어요. 삼각형이 아니에요!</div>`;
  const kindTxt=I.kind==='right'?'가장 큰 각 = 90° 직각!':I.kind==='big'?`가장 큰 각 ≈ ${I.ang.toFixed(1)}° (90°보다 커요)`:`가장 큰 각 ≈ ${I.ang.toFixed(1)}° (90°보다 작아요)`;
  return `<div class="read"><div><span>짧은 변²</span><b>${I.a}</b></div><div><span>중간 변²</span><b>${I.b}</b></div><div style="background:var(--sky);color:#22201C"><span style="color:#22201C">가장 긴 변²</span><b>${I.c}</b></div></div>
   <div class="angle ${I.kind}">${I.kind==='right'?'📐':'📏'} ${kindTxt}</div>`;
}
function canRecord(I){
  if(I.bad) return false;
  const key=[I.a,I.b,I.c].join('-');
  if(st.at==='m1') return I.kind==='right'&&st.rec1.length<3&&!st.rec1.some(r=>r.key===key);
  if(st.at==='m2'){ if(st.rec2.length>=2||I.kind==='right') return false; return !st.rec2.some(r=>r.kind===I.kind); }
  return false;
}
/* 드래그: 끄는 동안은 화면 고정, 놓으면 전체가 보이게 맞춤 */
let drag=null;
function svgPt(e){const sv=$('#board'),r=sv.getBoundingClientRect();
  return {x:view.x+(e.clientX-r.left)*view.w/r.width,y:view.y+(e.clientY-r.top)*view.h/r.height};}
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.h');if(!h)return;
  drag=+h.dataset.i;h.classList.add('drag');e.preventDefault();});
document.addEventListener('pointermove',e=>{if(drag===null)return;const p=svgPt(e);
  const nx=Math.max(0,Math.min(COLS,Math.round(p.x/CELL))), ny=Math.max(0,Math.min(ROWS,Math.round(-p.y/CELL)));
  if(nx!==P[drag].x||ny!==P[drag].y){P[drag]={x:nx,y:ny};paint();}});
document.addEventListener('pointerup',()=>{if(drag!==null){drag=null;drawBoard(true);}});
document.addEventListener('keydown',e=>{const h=document.activeElement;if(!h||!h.classList||!h.classList.contains('h'))return;
  const i=+h.dataset.i,mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(!mv)return;e.preventDefault();
  P[i]={x:Math.max(0,Math.min(COLS,P[i].x+mv[0])),y:Math.max(0,Math.min(ROWS,P[i].y+mv[1]))};drawBoard(false);document.querySelector(`.h[data-i="${i}"]`).focus();});

/* ---------------- 각 화면 ---------------- */
const M=s=>`<span class="math">${s}</span>`;
function sumCell(r,i,showSum){
  if(showSum!=='input') return `<td class="sum ${showSum?'':'hidden-col'}">${showSum?r.a+r.b:'?'}</td>`;
  if(r.ok) return `<td class="sum ok">✔ ${r.a+r.b}</td>`;

    const r={a:I.a,b:I.b,c:I.c,kind:I.kind,key:[I.a,I.b,I.c].join('-')};
    (b.dataset.rec==='1'?st.rec1:st.rec2).push(r); save(); render(); return;}
  if(b.dataset.quiz){st[b.dataset.quiz]=+b.dataset.i;save();render();return;}
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t.classList||!t.classList.contains('sumIn')) return;
  const i=+t.dataset.row, r=(st.at==='m2'?st.rec2:st.rec1)[i], v=t.value.trim();
  if(v===''){r.try='';return;}
  r.try=v; r.wrong=+v!==r.a+r.b; r.ok=!r.wrong; save(); render();
  const nx=document.querySelector('.sumIn'); if(nx) nx.focus();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.m3!==undefined){st.m3[b.dataset.m3]=b.dataset.v==='1';save();render();return;}
  if(b.dataset.m4!==undefined){st.m4[b.dataset.m4]=b.dataset.v==='1';save();render();return;}
  if(b.id==='restart'){st={at:'s0',done:{},rec1:[],rec2:[],q1:null,q2a:null,q2b:null,m3:{},m4:{}};P=[{x:3,y:2},{x:9,y:2},{x:5,y:6}];save();render();}
});
render();
</script>
